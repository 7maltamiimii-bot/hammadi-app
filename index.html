<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق حملة الحمادي — النسخة الهادئة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7C1D3F; --brand-d:#5E1430; --brand-l:#F7EBEF; --brand-b:#E6CDD6;
  --h1:#7C1D3F; --h2:#5E1430;
  --gold:#B48A3C; --gold-l:#FBF3E3;
  --bg:#F5F1F2; --card:#FFFFFF; --ink:#1B0D13; --ink2:#55454C; --mute:#6F6068; --line:#EBE5E7;
  --ok:#2E7D5B; --ok-l:#E8F3EE; --bad:#C0392B; --bad-l:#FDECEA;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:#CFC8CB;font-family:'IBM Plex Sans Arabic','Noto Sans Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  color:var(--ink);display:flex;align-items:center;justify-content:center;padding:12px 8px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.phone{width:100%;max-width:393px;height:min(852px,calc(100dvh - 24px));background:var(--bg);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;box-shadow:0 40px 80px -40px rgba(0,0,0,.45)}
@media (max-width:440px){body{padding:0;background:var(--bg)}.phone{height:100dvh;max-width:none;border-radius:0;box-shadow:none}}
.demo{background:#1B0D13;color:#fff;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px;flex:none}
.demo span{opacity:.7}
.demo button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:5px 13px;font-weight:600;font-size:13px}
.demo button.on{background:var(--gold);color:#1B0D13}
/* header */
.hd{background:var(--h1);color:#fff;padding:10px 16px 22px;display:flex;align-items:center;gap:12px;flex:none}
.hd .lg{background:rgba(255,255,255,.95);color:var(--h1);font-size:22px;font-weight:700;border:0;width:48px;height:48px;border-radius:50%;flex:none}
.hd .nm{font-size:20px;font-weight:700;line-height:1.2}
.hd .sb{font-size:14px;opacity:.78}
.busp{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700;margin-top:4px}
.busp i{width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #fff;flex:none}
.hd .ac{margin-inline-start:auto;display:flex;gap:10px}
.ib{width:46px;height:46px;border-radius:15px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;position:relative}
.ib svg{width:24px;height:24px}
.ib.sos{background:#fff;color:var(--bad)}
.ib .b{position:absolute;top:-5px;inset-inline-end:-5px;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:#1B0D13;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* screen: NEVER scrolls — content is sized to fit */
.sc{flex:1;min-height:0;overflow:hidden;margin-top:-12px;border-radius:24px 24px 0 0;background:var(--bg);padding:12px 16px 10px;position:relative}
#cn{display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(27,13,19,.05),0 10px 24px -16px rgba(27,13,19,.22)}
.h1{font-size:24px;font-weight:700;margin:0 4px;display:flex;align-items:center;justify-content:space-between;min-height:42px}
.h1 small{font-size:15px;font-weight:500;color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:15px;font-weight:600;white-space:nowrap;flex:none}
.pill svg{width:18px;height:18px;flex:none}
.bkb{width:42px;height:42px;border-radius:13px;border:0;background:var(--card);color:var(--brand);display:grid;place-items:center;margin-inline-end:10px;flex:none}
.bkb svg{width:23px;height:23px;transform:scaleX(-1)}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--h1);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
.btn svg{width:23px;height:23px}
.btn.w{background:#fff;color:#7C1D3F}
.btn.o{background:var(--card);color:var(--brand);border:2px solid var(--brand-b)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:13px 15px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:170px;height:170px;border-radius:50%;border:24px solid rgba(255,255,255,.06);top:-70px;inset-inline-start:-55px;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:15px;opacity:.82}
.hero .t{font-size:24px;font-weight:700;line-height:1.25}
.hero .btn{margin-top:11px}
/* schedule (home) */
.sched .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;cursor:pointer}
.sched .hdr b{font-size:23px;display:flex;align-items:center;gap:6px}
.sched .hdr b svg{width:22px;height:22px;opacity:.8}
.nxc{background:#fff;color:#1B0D13;border-radius:18px;padding:11px 13px}
.nxc .r1{display:flex;align-items:center;justify-content:space-between}
.tg{display:inline-block;background:#F7EBEF;color:#7C1D3F;font-size:14px;font-weight:700;border-radius:99px;padding:3px 11px}
.nxc .tm2{font-size:21px;font-weight:700;color:#7C1D3F}
.nxc .tt{font-size:22px;font-weight:700;margin-top:6px;line-height:1.3}
.nxc .ss{font-size:15px;color:#6B5A62}
.nxc .hint{font-size:16px;color:#7C1D3F;font-weight:700;margin-top:3px}
.acts{display:flex;gap:10px;margin-top:8px}
.mini{height:52px;border:0;border-radius:15px;background:#7C1D3F;color:#fff;font-size:18px;font-weight:700;flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.mini svg{width:23px;height:23px}
.mini.sq{flex:none;width:54px;background:#F7EBEF;color:#7C1D3F}
.thn{font-size:16px;opacity:.9;margin-top:7px;text-align:center}
/* 3-up and 4-up tiles */
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c3,.c4{background:var(--card);border:0;border-radius:20px;color:var(--ink);text-align:center;position:relative;
  box-shadow:0 1px 2px rgba(27,13,19,.05),0 10px 24px -16px rgba(27,13,19,.22);display:flex;flex-direction:column;align-items:center}
.c3{padding:13px 4px 11px;gap:3px}
.c4{padding:12px 2px 10px;gap:5px}
.c3 b{font-size:19px;line-height:1.2}
.c3 small{font-size:15px;color:var(--mute);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4 b{font-size:17px;line-height:1.2}
.bb{width:48px;height:48px;border-radius:15px;background:var(--c);color:#fff;font-size:28px;font-weight:700;display:grid;place-items:center;margin-bottom:3px}
.ic2{width:48px;height:48px;border-radius:15px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;margin-bottom:3px;position:relative}
.ic2 svg{width:26px;height:26px}
.ic2.g{background:var(--gold-l);color:var(--gold)}.ic2.k{background:var(--ok-l);color:var(--ok)}
.nb{position:absolute;top:-6px;inset-inline-start:-6px;min-width:24px;height:24px;border-radius:99px;background:var(--bad);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid var(--card)}
/* video card */
.vcard{display:flex;align-items:center;gap:13px;width:100%;border:0;text-align:start;color:var(--ink);padding:11px}
.vth{width:84px;height:84px;border-radius:17px;background:linear-gradient(160deg,var(--h1),var(--h2));position:relative;display:grid;place-items:center;flex:none}
.vth .pl,.vt .pl{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
.vth .pl svg,.vt .pl svg,.player .big svg{width:21px;height:21px;fill:#fff;stroke:none}
.vth .dur{position:absolute;bottom:6px;inset-inline-start:6px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;border-radius:7px;padding:1px 7px}
.vb{flex:1;min-width:0}
.vb .k{font-size:15px;color:var(--brand);font-weight:700}
.vb b{font-size:21px;line-height:1.3;display:block}
.vb small{font-size:15px;color:var(--mute);display:flex;align-items:center;gap:5px}
.vb small svg{width:16px;height:16px;color:var(--ok)}
/* mufti card */
.muf{background:linear-gradient(160deg,#B48A3C,#7E5E14);color:#fff;border:0;border-radius:20px;padding:10px 14px;width:100%;text-align:start;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px -14px rgba(126,94,20,.7)}
.mav{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.mav svg{width:28px;height:28px}
.muf{position:relative}
.muf .mt{font-size:22px;font-weight:700;line-height:1.2;white-space:nowrap}
.muf .ms{font-size:15px;opacity:.92;display:flex;align-items:center;gap:5px;white-space:nowrap}
.muf .ms svg{width:15px;height:15px}
.mnew{position:absolute;top:-9px;inset-inline-start:16px;background:#fff;color:#B03A2E;border-radius:99px;padding:2px 11px;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.mgo{margin-inline-start:auto;background:#fff;color:#7E5E14;border-radius:14px;padding:11px 16px;font-size:18px;font-weight:700;white-space:nowrap}
/* prep card steps in one row */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0 0}
.step{text-align:center;font-size:15px;font-weight:600;padding:9px 2px;border-radius:14px;background:rgba(255,255,255,.12)}
.step svg{display:block;margin:0 auto 3px;width:23px;height:23px}
.step.done{background:rgba(255,255,255,.95);color:#7C1D3F}
.wide{display:flex;align-items:center;gap:13px;width:100%;border:0;color:var(--ink);text-align:start;padding:13px 15px}
.wide .ic2{margin:0;flex:none}
.wide b{font-size:20px;display:block;line-height:1.3}.wide small{font-size:15px;color:var(--mute)}
.wide.sch{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff}
.wide.sch .ic2{background:rgba(255,255,255,.16);color:#fff}.wide.sch small{color:rgba(255,255,255,.85)}
.chev{margin-inline-start:auto;width:22px;height:22px;color:var(--mute);flex:none}
.wide.sch .chev{color:#fff}
/* learn / videos */
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vt{border:0;border-radius:20px;color:#fff;position:relative;padding:12px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;text-align:start;background:linear-gradient(160deg,#9A3A58,#5E1430)}
.vt:nth-child(3n+2){background:linear-gradient(160deg,#946C1E,#6B4B10)}
.vt:nth-child(3n){background:linear-gradient(160deg,#3F6F5E,#1F4435)}
.vt .pl{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px}
.vt .pl svg{width:17px;height:17px}
.vt b{font-size:17px;line-height:1.25;display:block}
.vt small{font-size:14px;opacity:.88}
.vt .ck{position:absolute;top:10px;inset-inline-start:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ok);display:grid;place-items:center}
.vt .ck svg{width:17px;height:17px}
.vt.nx{outline:4px solid var(--gold);outline-offset:-4px}
.vt.lec{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(27,13,19,.05)}
.vt.lec .pl{background:var(--gold-l);color:var(--gold)}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
/* quiz */
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pod div{background:var(--card);border-radius:18px;padding:11px 4px;text-align:center;box-shadow:0 1px 2px rgba(27,13,19,.05)}
.pod .n{width:34px;height:34px;border-radius:50%;background:var(--gold-l);color:#8A6410;display:grid;place-items:center;font-weight:700;font-size:17px;margin:0 auto 4px}
.pod b{font-size:15px;display:block;line-height:1.3}.pod i{font-style:normal;font-size:18px;font-weight:700;color:var(--brand)}
/* generic lists */
.lst{padding:2px 16px}
.li{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);font-size:19px;font-weight:600}
.li:last-child{border:0}
.li .ic{width:42px;height:42px;border-radius:13px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;flex:none}
.li .ic svg{width:23px;height:23px}
.chip{margin-inline-start:auto;font-size:15px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--ink2)}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.wr{background:var(--gold-l);color:#8A6410}
.li .chev{margin-inline-start:8px}
/* timeline (schedule screen) */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:4px}
.seg button{border:0;background:none;border-radius:12px;height:46px;font-size:18px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--h1);color:#fff}
.ti{display:grid;grid-template-columns:62px 18px 1fr;gap:10px;padding:5px 0;color:var(--ink)}
.ti .tm{text-align:center;padding-top:3px}.ti .tm b{font-size:20px;display:block;line-height:1.1}.ti .tm i{font-style:normal;font-size:14px;color:var(--mute)}
.ti .dt{display:flex;flex-direction:column;align-items:center;color:var(--brand)}
.ti .dt span{width:15px;height:15px;border-radius:50%;border:3px solid currentColor;margin-top:7px;flex:none}
.ti .dt::after{content:'';flex:1;width:2px;background:currentColor;opacity:.25;margin-top:4px}
.ti:last-child .dt::after{display:none}
.ti .bd b{font-size:19px;display:block;line-height:1.35}.ti .bd small{font-size:15px;color:var(--mute);display:block}
.ti.done{opacity:.55}.ti.done .dt span{background:currentColor}
.ti.next .dt span{background:var(--brand);box-shadow:0 0 0 5px var(--brand-l)}
.ti.next .bd{background:var(--brand-l);border-radius:16px;padding:11px 13px}
.ti .hint{display:block;font-size:15px;color:var(--brand);font-weight:700;margin-top:3px}
.srow{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.3;font-weight:600}
.srow:last-child{border:0}
.srow .d{width:94px;text-align:start;font-size:15px;color:var(--mute);font-weight:600;flex:none;white-space:nowrap}
.srow .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--brand);flex:none}
.srow.done{opacity:.5}.srow.done .dot{background:var(--brand)}
.srow.next{color:var(--brand)}.srow.next .dot{background:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
/* bus / medical / player / mufti */
.busbig{background:var(--c);color:#fff;border-radius:24px;padding:14px 16px;text-align:center}
.busbig .n{font-size:104px;font-weight:700;line-height:1}
.busbig .l{font-size:24px;font-weight:700}
.busbig .s{font-size:16px;opacity:.92;margin-top:4px}
.rowc{display:flex;align-items:center;gap:13px}
.rowc b{font-size:21px;display:block}.rowc small{font-size:16px;color:var(--mute)}
.cbtn{width:54px;height:54px;border-radius:17px;border:0;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.cbtn svg{width:26px;height:26px}
.kv2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:19px}
.kv2:last-child{border:0}.kv2 span{color:var(--mute);font-size:16px}.kv2 b{text-align:end}
.blood{font-size:72px;font-weight:700;color:var(--bad);line-height:1}
.note{display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;color:var(--mute);text-align:center}
.note svg{width:18px;height:18px;flex:none}
.player{background:linear-gradient(160deg,var(--h1),var(--h2));border-radius:22px;padding:14px;color:#fff}
.player .scr{height:128px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;margin-bottom:12px}
.player .big{width:70px;height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center}
.player .big svg{width:30px;height:30px;fill:#7C1D3F}
.player .pb{height:9px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.player .pb i{display:block;height:100%;background:var(--gold);border-radius:99px}
.player .tm{display:flex;justify-content:space-between;font-size:16px;margin-top:6px;opacity:.9}
.sw2{background:var(--card);border:2px solid var(--line);color:var(--ink);height:54px;border-radius:16px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.sw2 svg{width:22px;height:22px}
.sw2.on{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.ta{width:100%;height:96px;border:2px solid var(--line);border-radius:16px;padding:12px;font-family:inherit;font-size:19px;background:var(--card);color:var(--ink);resize:none}
.qrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:18px;font-weight:600}
.qrow:last-child{border:0}.qrow .q{flex:1;line-height:1.35}
.sub{font-size:15px;color:var(--mute);margin:0 6px;font-weight:600}
/* nav */
.nv{flex:none;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px 1px calc(8px + env(safe-area-inset-bottom,0px))}
.nv button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;padding:4px 0;position:relative;white-space:nowrap;min-width:0}
.nv svg{width:25px;height:25px}
.nv button.on{color:var(--brand)}
.nv button.on::before{content:'';position:absolute;top:-8px;width:28px;height:4px;border-radius:99px;background:var(--brand)}
.bot2{display:contents}
/* short screens (16:9 and older phones): denser layout, nothing is removed */
.tight .demo{padding:4px 10px;font-size:12px}
.tight .demo button{padding:3px 11px;font-size:12px}
.tight .hd{padding:7px 14px 18px;gap:10px}
.tight .hd .lg{width:42px;height:42px;font-size:20px}
.tight .hd .sb{display:none}
.tight .hd .nm{font-size:19px}
.tight .ib{width:42px;height:42px}
.tight .sc{padding:10px 14px 8px;margin-top:-10px}
.tight #cn{gap:9px}
.tight .h1{font-size:22px;min-height:34px}
.tight .btn{height:48px;font-size:18px}
.tight .mini{height:46px;font-size:17px}
.tight .hero{padding:11px 13px}
.tight .hero .t{font-size:22px}
.tight .sched .hdr{margin-bottom:7px}
.tight .sched .hdr b{font-size:21px}
.tight .nxc{padding:9px 12px}
.tight .nxc .tt{font-size:20px;margin-top:3px}
.tight .nxc .hint{font-size:15px;margin-top:1px}
.tight .acts{margin-top:7px}
.tight .thn{display:none}
.tight .c3{padding:9px 3px 8px}
.tight .bb,.tight .ic2{width:40px;height:40px;font-size:24px;margin-bottom:2px}
.tight .ic2 svg{width:23px;height:23px}
.tight .c3 b{font-size:18px}
.tight .c4{padding:9px 2px 8px;gap:4px}
.tight .bot2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tight .vcard{flex-direction:column;align-items:stretch;gap:6px;padding:8px}
.tight .vth{width:100%;height:56px}
.tight .vb b{font-size:18px}
.tight .vb .k{font-size:14px}

vid:()=>{const nr=nextRite(),nxt=RITES[RITES.indexOf(nr)+1];
  return `${back(nr[0])}

    <button class="sw2 ${VID.audio?'on':''}" onclick="VID.audio=!VID.audio;render()">${ic('headset')} صوت فقط</button></div>

vids:()=>`${back('كل المقاطع')}

    <button class="vt lec" onclick="toast('الخواطر والدروس')"><span class="pl">${ic('video')}</span><b>الخواطر والدروس</b><small>محاضرات مسجّلة</small></button></div>`,

mufti:()=>`${back('اسأل المفتي')}
  <div class="card rowc" style="padding:11px 14px"><span class="mav" style="background:var(--gold-l);color:var(--gold)">${ic('mufti')}</span><div><b style="font-size:20px">الشيخ عبدالرحمن اليوسف</b><small>يجيب خلال ساعة غالباً</small></div></div>
  <textarea class="ta" id="mq" placeholder="اكتب سؤالك هنا…"></textarea>

settings:()=>`<div class="h1">الإعدادات<small>الحساب والتطبيق</small></div>
  <div class="card lst">
    <div class="li"><span class="ic">${ic('book')}</span>اللغة<span class="chip ok">العربية</span></div>
    <div class="li"><span class="ic">${ic('doc')}</span>حجم الخط<div class="opt"><button class="${SET.font==='كبير'?'on':''}" onclick="SET.font='كبير';render()">كبير</button><button class="${SET.font==='أكبر'?'on':''}" onclick="SET.font='أكبر';render()">أكبر</button></div></div>

    <div class="li" onclick="toast('الشكاوى والطلبات')"><span class="ic">${ic('chat')}</span>الشكاوى والطلبات${ic('chev','chev')}</div>
    <div class="li" onclick="toast('أرقام الحملة والدعم')"><span class="ic">${ic('phone')}</span>الدعم وأرقام الحملة${ic('chev','chev')}</div>
    <div class="li" style="color:var(--bad)" onclick="toast('تسجيل الخروج')"><span class="ic" style="background:var(--bad-l);color:var(--bad)">${ic('lock')}</span>تسجيل الخروج</div></div>`,

me:()=>`${back('ملفي')}
  <div class="card" style="padding:12px 14px"><div class="rowc"><span class="mav" style="background:var(--brand-l);color:var(--brand);font-size:26px;font-weight:700">م</span><div style="flex:1"><b style="font-size:22px">محمد سالم الكواري</b><small>عضوية ${ar('1448-0002')}</small></div></div>
    <button class="btn" style="margin-top:11px" onclick="toast('بطاقتي للمسح')">${ic('qr')} بطاقتي للمسح</button></div>
  <div class="card lst">
    <div class="li"><span class="ic">${ic('id')}</span>بياناتي<span class="chip ok">مكتملة</span>${ic('chev','chev')}</div>
    <div class="li" onclick="openSub('med')"><span class="ic" style="background:var(--bad-l);color:var(--bad)">${ic('heart')}</span>بطاقتي الطبية<span class="chip ok">جاهزة</span>${ic('chev','chev')}</div>
    <div class="li"><span class="ic">${ic('doc')}</span>مستنداتي<span class="chip wr">${ar(5)} من ${ar(6)}</span>${ic('chev','chev')}</div>
    <div class="li"><span class="ic">${ic('money')}</span>المدفوعات<span class="chip ok">مسددة</span>${ic('chev','chev')}</div></div>
  <button class="card wide" onclick="go('settings')"><span class="ic2" style="background:var(--bg);color:var(--ink2)">${ic('gear')}</span><div style="flex:1"><b>الإعدادات</b><small>اللغة والخط والإشعارات</small></div>${ic('chev','chev')}</button>`
};

/* ---------------- engine ---------------- */
function nav(){const cur=SUB[TAB]?PREV:TAB;
  const T=[['home','الرئيسية','home'],['trip','رحلتي','bus'],['worship','العبادة','book'],['act','تعلّم','video'],['quiz','المسابقات','trophy'],['settings','الإعدادات','gear']];
  document.getElementById('nv').innerHTML=T.map(([k,t,i])=>`<button class="${cur===k?'on':''}" onclick="go('${k}')">${ic(i)}${t}</button>`).join('')}
function fit(){document.querySelector('.phone').classList.toggle('tight',window.innerHeight<830);
  const sc=document.getElementById('sc'),cn=document.getElementById('cn');
  cn.style.zoom=1;const avail=sc.clientHeight-22,h=cn.scrollHeight;
  sc.style.overflowY='hidden';if(h>avail){const z=avail/h;cn.style.zoom=Math.max(.7,z);if(z<.7)sc.style.overflowY='auto'}}
function render(){document.getElementById('cn').innerHTML=SC[TAB]();nav();
  document.getElementById('bp').classList.toggle('on',PHASE==='pre');document.getElementById('bt').classList.toggle('on',PHASE==='trip');fit()}
function go(k){STACK=[];if(!SUB[k])PREV=k;TAB=k;render();location.hash=k}
function openSub(k){STACK.push(TAB);TAB=k;render()}
function goBack(){TAB=STACK.pop()||PREV;render()}
function setPhase(p){PHASE=p;render()}
function toast(m){const t=document.getElementById('ts');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1800)}
function togglePlay(){VID.playing=!VID.playing;clearInterval(VID.t);
  if(VID.playing)VID.t=setInterval(()=>{VID.prog=Math.min(100,VID.prog+1);const e=document.getElementById('pbi');if(e)e.style.width=VID.prog+'%';
    const m=document.getElementById('pbt');if(m){const sec=Math.round(200*VID.prog/100);m.textContent=ar(Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'))}
    if(VID.prog>=100){VID.playing=false;clearInterval(VID.t);render()}},350);
  render()}
function sendQ(){const t=document.getElementById('mq');if(!t||!t.value.trim()){toast('اكتب سؤالك أولاً');return}
  MQ.unshift({q:t.value.trim(),st:'wait'});render();toast('أُرسل سؤالك — سيصلك الجواب هنا')}
/* SOS */
let SOS={step:'menu',type:null};
function openSos(){SOS={step:'menu',type:null};sosR();document.getElementById('sos').classList.add('on')}
function closeSos(){document.getElementById('sos').classList.remove('on')}
function sosPick(t){SOS.type=t;SOS.step=t==='lost'?'lost':'confirm';sosR()}
function sosSend(){SOS.step='sent';sosR()}
function sosR(){let h='';const med=SOS.type==='med';
  if(SOS.step==='menu')h=`<h2>ماذا حدث؟</h2>
    <button class="sbtn l" onclick="sosPick('lost')"><span class="ic">${ic('pin')}</span><div>أنا تائه<small>تظهر لك بطاقة تعريف لمن حولك</small></div></button>
    <button class="sbtn m" onclick="sosPick('med')"><span class="ic">${ic('pulse')}</span><div>أحتاج إسعافاً<small>يصل موقعك للقائد والإدارة</small></div></button>
    <button class="sbtn h" onclick="sosPick('help')"><span class="ic">${ic('hands')}</span><div>أحتاج مساعدة<small>مشكلة في الباص أو السكن</small></div></button>
    <button class="btn o" onclick="closeSos()">إلغاء</button>`;
  else if(SOS.step==='confirm')h=`<h2>${med?'إسعاف':'مساعدة'}</h2><div class="card"><div style="font-size:21px;line-height:1.7">سيصل موقعك الآن إلى قائد الباص سعد العتيبي وإدارة الحملة.</div></div>
    <button class="btn" style="background:var(--bad);margin-top:10px" onclick="sosSend()">تأكيد الإرسال</button><button class="btn o" style="margin-top:10px" onclick="SOS.step='menu';sosR()">رجوع</button>`;
  else if(SOS.step==='sent')h=`<div class="card" style="text-align:center;padding:18px"><div style="font-size:42px;color:var(--ok)">✓</div><div style="font-size:25px;font-weight:700">وصل بلاغك</div><div style="font-size:19px;color:var(--ink2);margin-top:4px">القائد في الطريق إليك — ابقَ في مكانك</div></div>
    <div style="height:10px"></div>${callCard('سعد العتيبي','قائد الباص')}<div style="height:10px"></div>
    ${med?`<button class="btn" style="margin-bottom:10px" onclick="closeSos();openSub('med')">${ic('heart')} بطاقتي الطبية</button>`:''}<button class="btn o" onclick="closeSos()">إغلاق</button>`;
  else h=`<div class="lostc"><div class="a">أنا حاج تائه — ساعدني</div><div class="nm">محمد الكواري</div><div class="ln">حملة الحمادي — باص ${ar(7)}</div><div class="ln">هيلتون العزيزية — غرفة ${ar(312)}</div></div>
    ${callCard('سعد العتيبي','قائد الباص')}<div style="height:10px"></div>${callCard('مركز الحملة','على مدار الساعة')}<div style="height:10px"></div><button class="btn o" onclick="closeSos()">إغلاق</button>`;
  document.getElementById('sos').innerHTML=`<div class="sheet">${h}</div>`}
window.addEventListener('resize',()=>fit());
(function(){const h=location.hash.slice(1);if(SC[h]&&!SUB[h]){TAB=h;PREV=h}if(location.hash.includes('trip'))PHASE='trip';render()})();
</script>
</body>
</html>
